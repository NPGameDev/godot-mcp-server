name: Cross-version behavioral (smoke + flows)
description: >
  Language-parameterized cross-version behavioral harness. Launches a real
  headless Godot editor (standard for GDScript, .NET/mono for C#) against a
  target project, then round-trips the FULL server smoke + flows suites through
  the WS bridge. The `language` flag swaps ONLY the environment (editor build,
  project path/name, per-row TFM, addon injection, the 4.2 class-cache warm-up);
  the smoke/flows invocation is byte-identical across languages, so the GDScript
  and C# tiers cannot drift on the section set. Serves FOUR caller jobs — both
  languages in BOTH repos: each cross-version.yml (toolkit and server) hosts a
  gdscript AND a dotnet behavioral job, so an opt-in on either repo proves the
  full GDScript+.NET contract for that repo's change against the pinned sibling.
  Works from either workspace layout (toolkit-as-root with the server at server/;
  server-as-root with the toolkit at toolkit/) — the gdscript project-path always
  points at the toolkit root, server-dir at the server checkout. The
  caller must check out both repos (self + sibling) first.

  Cross-platform: the same flow runs on ubuntu / macOS /
  windows runners; the `os` input selects the per-OS branches (GNU-timeout binary,
  the editor stop's process lookup and kill fallback, dispatch token path, macOS
  quarantine strip). Linux is the default,
  so the pre-existing Linux callers are unaffected.

inputs:
  language:
    description: "gdscript (standard editor + dogfood) | dotnet (mono editor + C# fixture)"
    required: true
  os:
    description: >
      Host-OS branch key for the platform-specific mechanics — the GNU-timeout
      binary, the editor stop's kill fallback, the dispatch token path, and the macOS quarantine
      strip: "linux" (default — the original Linux-coded flow) | "macos" |
      "windows". Callers pass the matrix os_key; the pre-existing Linux caller
      jobs omit it and inherit the default, so their behaviour is byte-identical.
      Everything else in the flow (editor launch, poll, smoke, flows, dispatch)
      is OS-agnostic.
    required: false
    default: "linux"
  godot-version:
    description: "Godot version to provision (e.g. 4.5.0)"
    required: true
  project-path:
    description: "Absolute path to the editor project (--path target + GODOT_MCP_PROJECT_PATH)"
    required: true
  project-name:
    description: "GODOT_MCP_PROJECT_NAME the smoke/flows harness reports"
    required: true
  server-dir:
    description: >
      Directory holding the server checkout, where the npm build/smoke/flows run.
      Self (dotnet caller) = '.'; sibling (gdscript caller) = 'server'.
    required: false
    default: "."
  tfm:
    description: "Target framework moniker for the C# fixture (dotnet only; e.g. net8.0)"
    required: false
    default: ""
  toolkit-addon-src:
    description: "Absolute path to addons/godot_mcp_toolkit to inject into the fixture (dotnet only)"
    required: false
    default: ""
  run-dispatch:
    description: >
      "true" to run the dispatch-integration suite (test:integration:dispatch)
      against the booted editor AFTER smoke+flows. Enabled by the caller on exactly
      one row per repo mirror (GDScript · 4.7.0). Composite inputs are STRINGS, so
      this is compared to the literal 'true'.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Resolve the GNU-`timeout`-compatible binary for this OS ONCE and stash it in
    # $GITHUB_ENV so every fused step below (warm-up, smoke, flows, dispatch) reads
    # $TIMEOUT_BIN. Why per-OS (a real footgun): on Windows `shell: bash`
    # (Git Bash) a bare `timeout` can resolve to C:\Windows\System32\timeout.exe — a
    # DIFFERENT command that errors on redirected stdin — so we force Git Bash's
    # bundled GNU coreutils build at /usr/bin/timeout. macOS ships NO `timeout` in
    # the base system; coreutils provides `gtimeout` (pre-installed on the GitHub
    # runner image; brew-installed as a fallback if a future image drops it). Linux
    # has GNU `timeout` on PATH. All three accept the same `-k <grace> <secs>` form.
    - name: Resolve platform tools (GNU timeout binary)
      shell: bash
      run: |
        case "${{ inputs.os }}" in
          windows) TIMEOUT_BIN=/usr/bin/timeout ;;
          macos)
            if ! command -v gtimeout >/dev/null 2>&1; then brew install coreutils; fi
            TIMEOUT_BIN=gtimeout ;;
          *)       TIMEOUT_BIN=timeout ;;
        esac
        echo "TIMEOUT_BIN=$TIMEOUT_BIN" >> "$GITHUB_ENV"
        echo "resolved TIMEOUT_BIN=$TIMEOUT_BIN (os=${{ inputs.os }})"

    # Crash reports need the OS's reporter set up before the first editor starts, the 4.2
    # warm-up's included. docs/dev/crash-reports.md explains how to read what they give.
    # Neither step can fail a leg: a missing report must never be why a job goes red.
    #
    # Windows: the machine-wide key rather than a per-application one, since the process
    # image depends on how setup-godot links the editor. DumpType 1 is the minimal dump, which
    # holds the stacks cdb reads. The dump stays on the runner: it holds some of the process's
    # memory, the WS auth token lives there, and artifacts on a public repo can be downloaded.
    - name: Enable crash dumps (windows)
      if: ${{ inputs.os == 'windows' }}
      continue-on-error: true
      shell: pwsh
      run: |
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
        $dumps = Join-Path $env:RUNNER_TEMP 'crash-dumps'
        New-Item -ItemType Directory -Force -Path $dumps | Out-Null
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null

    # Linux: the image's default core_pattern pipes to systemd-coredump, whose store is not where
    # the collect step reads. A file pattern replaces the pipe, whichever handler the image ships.
    # The core stays on the runner; the collect step below reads it with gdb. `ulimit -c` is per
    # shell, so each step that starts an editor sets its own.
    - name: Enable core files (linux)
      if: ${{ inputs.os == 'linux' }}
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p /tmp/cores
        sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p.%s

    - name: Setup Godot (Godot ${{ inputs.godot-version }})
      # pinned to v2.4.1 — update tag manually after reviewing changelogs
      uses: chickensoft-games/setup-godot@v2.4.1
      with:
        version: "${{ inputs.godot-version }}"
        use-dotnet: ${{ inputs.language == 'dotnet' }}

    - name: Setup .NET SDKs (8 + 6 ref packs for both TFMs)
      if: ${{ inputs.language == 'dotnet' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          6.0.x

    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: ${{ inputs.server-dir }}/package-lock.json

    - name: Install + build harness
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      run: npm ci && npm run build

    # gdscript: shields the server checkout's node_modules from the editor scan —
    # matters ONLY in the toolkit-as-root layout, where the server sibling checkout
    # (server/) lands INSIDE the toolkit editor project, so the scan would otherwise
    # descend into server/node_modules (a suspect in the 4.2.0 warm-up hang this
    # workflow once hit). In the server-as-root layout the server checkout IS the
    # workspace root and sits OUTSIDE the toolkit editor project (toolkit/), so this
    # touch is a harmless no-op on a dir the editor never scans.
    - name: Shield harness checkout from the editor scan (gdscript)
      if: ${{ inputs.language == 'gdscript' }}
      shell: bash
      run: touch "${{ inputs.server-dir }}/.gdignore"

    # dotnet: inject the toolkit addon into the fixture so the mono editor has the
    # MCP toolkit active (WS on 6550). Never committed (gitignored).
    - name: Inject toolkit addon into the fixture (dotnet)
      if: ${{ inputs.language == 'dotnet' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      run: npm run fixture:inject-addon
      env:
        TOOLKIT_ADDON_SRC: ${{ inputs.toolkit-addon-src }}

    # dotnet: the committed csproj pins the ceiling; retarget both the SDK version
    # AND the TargetFramework to this row so the editor's on-open build matches its
    # bundled runtime (a 4.3 editor ships .NET 6 and cannot load net8.0). Ephemeral.
    - name: Pin fixture Godot.NET.Sdk + TFM to matrix row (dotnet)
      if: ${{ inputs.language == 'dotnet' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      run: |
        node -e 'const fs=require("node:fs");const f="test/fixtures/csharp-project/McpValCs.csproj";let s=fs.readFileSync(f,"utf8");s=s.replace(/Godot\.NET\.Sdk\/[0-9.]+/,"Godot.NET.Sdk/"+process.env.SDK).replace(/<TargetFramework>[^<]+<\/TargetFramework>/,"<TargetFramework>"+process.env.TFM+"</TargetFramework>");fs.writeFileSync(f,s);console.log(s);'
      env:
        SDK: ${{ inputs.godot-version }}
        TFM: ${{ inputs.tfm }}

    # dotnet: build BEFORE launching the editor — a cold on-open build means §25's
    # node-level probe skips (McpValCsNode not yet registered in classdb).
    - name: dotnet build fixture (warm C# before launch) (dotnet)
      if: ${{ inputs.language == 'dotnet' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      run: dotnet build test/fixtures/csharp-project/McpValCs.csproj -c Debug -p:TargetFramework=${{ inputs.tfm }}

    # 4.2 only (BOTH languages): warm the script-class cache before the editor
    # launch. On a cold checkout, 4.2's editor scan aborts on cross-file class_name
    # refs (fixed in 4.3), so the plugin would fail to load. The scan-abort trigger
    # is the toolkit addon's GDScript class_name graph — present in BOTH tiers (the
    # dogfood commits it; the C# fixture has it injected), NOT the fixture's .cs — so
    # the warm-up is needed identically for gdscript AND dotnet at 4.2. run_units_cold.sh
    # (GODOT_WARM_ONLY skips the unit run) boots the editor scan and gates on the
    # cache ARTIFACT — a frame-count quit races the threaded scan on slow runner
    # disks, and --import cannot warm 4.2.0 at all (hangs without writing the cache;
    # engine bug, fixed by 4.2.2). A warm-up that cannot produce the cache fails THIS
    # step fast and loud (summary + tail land in warmup.log for the always() step) —
    # a job-level fuse kill would skip the always() steps entirely. 4.3+ needs no
    # warm-up.
    #
    # run_units_cold.sh REQUIRES CWD = the project root (it checks for project.godot
    # and uses CWD-relative paths: --path ., .godot/…), so cd into project-path first
    # in both languages: gdscript = the toolkit root (= workspace root when the
    # toolkit is self, = workspace/toolkit when the server is self); dotnet = the C#
    # fixture. For gdscript the script sits under that CWD (./scripts/...); for dotnet
    # the script lives in the TOOLKIT checkout, so it is invoked by absolute path
    # derived from toolkit-addon-src (strip the trailing /addons/godot_mcp_toolkit →
    # toolkit root → /scripts/test_framework/run_units_cold.sh). The mono editor is on
    # PATH after use-dotnet setup, so GODOT_BIN defaults to it. The tee target stays
    # $GITHUB_WORKSPACE-absolute so the always() log step (which runs from the
    # workspace root) still finds warmup.log after the cd.
    - name: Warm class cache (4.2 only — both languages)
      if: ${{ startsWith(inputs.godot-version, '4.2') }}
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        PROJECT_PATH: ${{ inputs.project-path }}
        TOOLKIT_ADDON_SRC: ${{ inputs.toolkit-addon-src }}
      run: |
        # pipefail is LOAD-BEARING: the warm-up script's exit code — including its
        # teardown's zombie hard-stop (exit 2) — must survive the `| tee` below;
        # without it tee's 0 would mask the failure and this step would go green.
        set -o pipefail
        if [ "${{ inputs.os }}" = "linux" ]; then
          ulimit -c unlimited || echo "::warning::core files stay off: ulimit -c unlimited was refused"
        fi
        cd "$PROJECT_PATH"
        if [ "$LANGUAGE" = "dotnet" ]; then
          toolkit_root="${TOOLKIT_ADDON_SRC%/addons/godot_mcp_toolkit}"
          warm_script="$toolkit_root/scripts/test_framework/run_units_cold.sh"
        else
          warm_script="./scripts/test_framework/run_units_cold.sh"
        fi
        GODOT_WARM_ONLY=1 "$TIMEOUT_BIN" 300 bash "$warm_script" 2>&1 | tee "$GITHUB_WORKSPACE/warmup.log"

    # macOS Gatekeeper: strip com.apple.quarantine off the downloaded editor so the
    # headless launch is not blocked. Best-effort (`|| true`) — a toolcache/HTTP
    # download usually carries no quarantine xattr, but a browser/DMG-sourced build
    # would, and clearing it is free insurance. macOS-only; a no-op elsewhere.
    - name: Strip macOS quarantine off the editor (macos)
      if: ${{ inputs.os == 'macos' }}
      shell: bash
      run: |
        godot_bin="$(command -v godot || true)"
        if [ -n "$godot_bin" ]; then
          xattr -dr com.apple.quarantine "$(dirname "$godot_bin")" 2>/dev/null || true
          echo "quarantine strip attempted on $(dirname "$godot_bin")"
        fi

    # A Windows editor started from Git Bash writes no dump, so the launch below goes through
    # scripts/ci/editor-launcher.c, whose header says why. EDITOR_LAUNCHER is set only once the
    # launcher has compiled and run a child. Otherwise the editor starts as plain `godot`: a leg
    # then loses its dump and its raw exit code, never its result. The 4.2 warm-up starts its
    # editor on its own and does not go through the launcher.
    - name: Compile the editor launcher (windows)
      if: ${{ inputs.os == 'windows' }}
      continue-on-error: true
      shell: bash
      run: |
        set +e
        no_launcher() {
          echo "::warning title=Editor launcher::$1; the editor starts as plain godot and a crash leaves no dump"
          exit 0
        }
        gcc_bin="$(command -v gcc)"
        for candidate in /c/mingw64/bin/gcc.exe /c/ProgramData/mingw64/mingw64/bin/gcc.exe; do
          if [ -z "$gcc_bin" ] && [ -x "$candidate" ]; then gcc_bin=$candidate; fi
        done
        [ -n "$gcc_bin" ] || no_launcher "no gcc on this runner"
        launcher_dir="$(cygpath -u "$RUNNER_TEMP")/editor-launcher"
        mkdir -p "$launcher_dir"
        launcher="$launcher_dir/editor-launcher.exe"
        # gcc finds its own tools through PATH.
        PATH="$(dirname "$gcc_bin"):$PATH" "$TIMEOUT_BIN" 120 "$gcc_bin" -o "$launcher" "${{ inputs.server-dir }}/scripts/ci/editor-launcher.c" \
          || no_launcher "the launcher did not compile with $gcc_bin"
        self_check="$("$TIMEOUT_BIN" 120 "$launcher" "$(cygpath -w /usr/bin/true.exe)")"
        case "$self_check" in
          *child_exit=0x00000000*) ;;
          *) no_launcher "the launcher did not run a child (it printed: ${self_check:-nothing})" ;;
        esac
        echo "EDITOR_LAUNCHER=$launcher" >> "$GITHUB_ENV"
        echo "editor launcher ready: $launcher (compiled with $gcc_bin)"

    # Bounded boot retry (up to 3 attempts): a CI editor can die at boot (a one-off
    # engine crash — e.g. an Abort trap on macOS) or hang without ever serving the
    # WS port, which would otherwise redden the leg with ZERO product assertions
    # run. Each attempt = launch → poll the WS port (process-death short-circuit) →
    # on death/timeout, warn, tail the log, tree-kill the remnant, and retry with a
    # fresh log. The RETRY WRAPS THE BOOT ONLY — smoke/flows are separate steps and
    # stay first-strike fatal. Self-terminates in <=180s (3 x 60s bounded), so it
    # still needs no shell timeout; the editor is reaped by the always() teardown.
    # On macOS with Godot 4.5.0 only, a job whose three attempts all died, each on the
    # engine crash fixed in 4.5.1 as its own crash report shows, passes with a warning and
    # sets `known_crash`, so the scene wait, smoke, flows and dispatch skip; a timeout or
    # any other death still fails. macOS writes a report about 20 s after the death, often
    # after the last attempt ends, so the step waits up to 60 s more for them itself.
    - name: Launch headless editor + poll WS port (bounded retry)
      id: boot
      shell: bash
      run: |
        # --log-file (Godot 4.3+ only — the flag does not exist on 4.2) enables editor-mode file
        # logging so editor.get_console source="file" exercises the REAL file-read path headless
        # (the file logger is otherwise off in --editor). `user://logs/godot.log` globalizes to the
        # user-data logs dir — the SAME dir the toolkit reader reads (source-verified via
        # FileAccess::fix_path; platform-agnostic), so engine-write and reader-read align. On Linux
        # the reader reads it -> entries; SMOKE_EXPECT_FILE_LOG (smoke step) makes §14 require that.
        LOGFILE_ARG=""
        case "${{ inputs.godot-version }}" in
          4.2*) : ;;  # no --log-file pre-4.3
          *) LOGFILE_ARG='--log-file user://logs/godot.log' ;;
        esac
        # The WS port the editor binds and the smoke/flows read. Defaults to 6550;
        # the 4.2 warm-up teardown (run_units_cold.sh) may have exported a spare
        # port via GODOT_MCP_EDITOR_PORT (port-agility) when a zombie still held
        # 6550, so honor it here and poll the SAME port the editor will bind (the
        # editor inherits GODOT_MCP_EDITOR_PORT from the environment).
        export POLL_PORT="${GODOT_MCP_EDITOR_PORT:-6550}"
        # Breadcrumb for the post-launch port forensics: a relocated main editor is
        # a deliberate fallback, not a second-editor (H1) incumbent squatting 6550.
        if [ "$POLL_PORT" != "6550" ]; then
          echo "NOTE: main editor intentionally relocated to port $POLL_PORT (port-agility fallback) — not an H1 incumbent"
        fi
        if [ "${{ inputs.os }}" = "linux" ]; then
          ulimit -c unlimited || echo "::warning::core files stay off: ulimit -c unlimited was refused"
        fi
        # Each attempt truncates editor.log, so a failed attempt's log is kept for the
        # crash-report upload: a boot that recovers would otherwise lose the crash's log.
        crash_report_dir="${RUNNER_TEMP:-/tmp}/crash-report"
        mkdir -p "$crash_report_dir"
        editor_cmd=(godot)
        if [ "${{ inputs.os }}" = "windows" ] && [ -n "${EDITOR_LAUNCHER:-}" ]; then
          editor_cmd=("$EDITOR_LAUNCHER" "$(cygpath -w "$(command -v godot)")")
          echo "starting the editor through $EDITOR_LAUNCHER"
        fi
        BOOT_OK=0
        EDITOR_PID=""
        DEAD_PIDS=()
        TIMED_OUT=0
        for attempt in 1 2 3; do
          "${editor_cmd[@]}" --headless --editor $LOGFILE_ARG --path "${{ inputs.project-path }}" > editor.log 2>&1 &
          EDITOR_PID=$!
          # Windows: record a native PID at the top of the editor's process tree while it
          # is alive: $! is an MSYS-space pid, so the reap below needs this for its taskkill.
          # It names the launcher, or the MSYS stub above it if bash reads it before the
          # launcher has started; a tree kill from either reaches the editor. The launcher
          # itself exits when the editor does, so the poll's `kill -0` follows the editor.
          # Read on each tick until it is known: a live launcher with none recorded would
          # leave an editor that owns no port beyond the reap's reach.
          EDITOR_WINPID=""
          REASON=""
          for i in $(seq 1 60); do
            if [ "${{ inputs.os }}" = "windows" ] && [ -z "$EDITOR_WINPID" ]; then
              EDITOR_WINPID="$(cat "/proc/$EDITOR_PID/winpid" 2>/dev/null || true)"
            fi
            if ! kill -0 "$EDITOR_PID" 2>/dev/null; then
              REASON="editor process died during boot"
              break
            fi
            if node -e 'const n=require("net");const p=Number(process.env.POLL_PORT||6550);const s=n.connect(p,"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1))'; then
              BOOT_OK=1
              break
            fi
            sleep 1
          done
          [ "$BOOT_OK" = "1" ] && break
          [ -n "$REASON" ] || REASON="WS port $POLL_PORT not listening after 60s"
          echo "::warning::boot attempt $attempt/3 failed ($REASON)"
          echo "boot attempt $attempt/3 failed ($REASON); editor.log tail:"
          tail -40 editor.log 2>/dev/null || true
          # Tree-kill the failed attempt before retrying so it can't linger as a
          # port thief. On Windows the POSIX kill targets an MSYS/shim pid it may
          # not reach, and an image-name taskkill is INERT on the runner (the
          # provisioned binary is Godot_v<ver>_win64.exe, never godot.exe) — so
          # kill the captured native PID tree, then (GitHub Actions only) every
          # LISTENING owner of the poll port, image-agnostic, so a shim-orphaned
          # editor cannot survive into the next attempt. The tree kill goes first:
          # a POSIX kill that ended the launcher would leave taskkill no tree to walk
          # and the editor running, and an editor still booting owns no port yet.
          # The `kill -0` keeps a PID Windows may have reused since the launcher exited out of taskkill.
          if [ "${{ inputs.os }}" = "windows" ] && [ -n "$EDITOR_WINPID" ] && kill -0 "$EDITOR_PID" 2>/dev/null; then
            taskkill //F //T //PID "$EDITOR_WINPID" 2>/dev/null || true
          fi
          kill "$EDITOR_PID" 2>/dev/null || true
          for _ in 1 2 3; do kill -0 "$EDITOR_PID" 2>/dev/null || break; sleep 1; done
          kill -9 "$EDITOR_PID" 2>/dev/null || true
          if [ "${{ inputs.os }}" = "windows" ] && [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            for pid in $(netstat -ano 2>/dev/null | grep -E ":$POLL_PORT[^0-9]" | grep "LISTENING" | awk '{print $NF}' | sort -u || true); do
              { [ -n "$pid" ] && [ "$pid" != "0" ]; } || continue
              echo "boot retry: force-killing LISTENING owner of port $POLL_PORT — PID $pid"
              taskkill //F //T //PID "$pid" 2>/dev/null || true
            done
          fi
          cp editor.log "$crash_report_dir/editor-attempt-$attempt.log" 2>/dev/null || true
          # Only a death can be the known engine crash below; an attempt that timed out alive never is.
          if [ "$REASON" = "editor process died during boot" ]; then
            DEAD_PIDS+=("$EDITOR_PID")
          else
            TIMED_OUT=1
          fi
          EDITOR_PID=""
          EDITOR_WINPID=""
        done
        echo "EDITOR_PID=$EDITOR_PID" >> "$GITHUB_ENV"
        echo "EDITOR_WINPID=$EDITOR_WINPID" >> "$GITHUB_ENV"
        if [ "$BOOT_OK" != "1" ]; then
          # Any exit but 0 from the matcher, its own crash included, falls through to the failure.
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ inputs.godot-version }}" = "4.5.0" ] \
            && [ "${#DEAD_PIDS[@]}" = "3" ] && [ "$TIMED_OUT" = "0" ]; then
            pid_args=()
            for dead_pid in "${DEAD_PIDS[@]}"; do pid_args+=(--pid "$dead_pid"); done
            if node "${{ inputs.server-dir }}/scripts/ci/known-engine-crash.mjs" \
              --reports "$HOME/Library/Logs/DiagnosticReports" \
              --runner-os "${{ runner.os }}" \
              --godot-version "${{ inputs.godot-version }}" \
              "${pid_args[@]}"; then
              echo "::warning title=Known engine crash::all 3 boot attempts died on the Godot 4.5.0 macOS export poller crash (Pure virtual function called!, fixed in 4.5.1), each proven by its crash report; the scene wait, smoke, flows and dispatch are skipped"
              echo "known_crash=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::error::editor failed to boot + serve WS port $POLL_PORT after 3 attempts"
          exit 1
        fi

    # Windows platform forensics (for diagnosing a 4.2 LSP hang) — pure-info
    # and FAIL-SAFE: every command is || true'd and the step exits 0, so it can
    # never redden a leg. Captures the process/port/registry state right after
    # the editor launch. The discriminator it exists for: a surviving 4.2
    # warm-up editor (zombie after a failed MSYS kill in run_units_cold.sh)
    # shows as a SECOND godot PID holding 6005/6550 while the main editor
    # silently re-registers on 6551 — the main editor's LSP bind then fails for
    # the whole session (4.2-4.4 has no bind retry), the leading hypothesis for
    # the Win·4.2 LSP initialize mute. Rides permanently as cheap forensics on
    # the Windows legs.
    - name: Platform diagnostics — processes + ports (windows)
      if: ${{ inputs.os == 'windows' }}
      shell: bash
      run: |
        echo "── EDITOR_PID=${EDITOR_PID:-unset} ──"
        tasklist 2>/dev/null | grep -iE "godot" || true
        echo "── port owners (6550/6551/6005) ──"
        netstat -ano 2>/dev/null | grep -E ":(6550|6551|6005)[^0-9]" || true
        echo "── toolkit registry ──"
        cat "$(cygpath -u "$APPDATA")/godot-mcp-toolkit/projects.json" 2>/dev/null || true
        echo "forensics key: H1 (zombie warm-up editor) = 2+ godot PIDs, or 6005/6550 owned by a PID that is not the main editor, or the registry shows the main editor on 6551 -> fix: warm-up teardown (toolkit scripts/test_framework/run_units_cold.sh). H2 (engine-internal LSP wedge) = exactly 1 godot PID, 6005 owned by the main editor, initialize still mute -> upstream Godot 4.2 defect (no LSP bind retry 4.2-4.4; unbudgeted main-thread poll, fixed-shape 4.3); the mitigation options are a maintainer decision."
        exit 0

    # The port being up does not mean the editor has a scene open. The toolkit starts
    # listening inside the editor's first filesystem scan, and the project's main scene
    # opens only when that scan ends, so for some seconds `scene.get_tree` answers
    # NO_SCENE, which fails the smoke's first section. This step calls `scene.get_tree`
    # through the bridge, with the smoke's own auth, until a scene comes back, bounded at
    # 60 s; it logs the wait in ms so a slower start stays visible. It sits outside the
    # boot retry: once the port is up the editor has booted, and a scene that never opens
    # (a project without a main scene, a stalled scan) would not open on a reboot either.
    # Like a failed boot, a timeout fails the leg before the smoke; the always() steps
    # below still stop the editor and read its log.
    - name: Wait for an edited scene (bounded)
      if: ${{ steps.boot.outputs.known_crash != 'true' }}
      shell: bash
      env:
        GODOT_MCP_PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        set +e
        bound_s=60
        out="$(node "${{ inputs.server-dir }}/scripts/ci/editor-wait-scene.mjs" --timeout-ms "$((bound_s * 1000))" 2>&1)"
        status=$?
        printf '%s\n' "$out"
        if [ "$status" != "0" ]; then
          verdict="$(printf '%s\n' "$out" | grep -E '^scene_wait=' | tail -n1)"
          case "$verdict" in
            scene_wait=timeout*)
              echo "::error::no edited scene within ${bound_s} s of the WS port ${GODOT_MCP_EDITOR_PORT:-6550} coming up: ${verdict}" ;;
            *)
              echo "::error::the scene wait could not run: ${verdict:-editor-wait-scene.mjs exited $status with no verdict line}" ;;
          esac
          echo "editor.log tail:"
          tail -40 editor.log 2>/dev/null || true
          exit 1
        fi

    # Composite-action run steps cannot take `timeout-minutes` (GitHub limitation),
    # so the long steps carry a shell `timeout` fuse instead — a hang fails the
    # STEP (letting the always() log steps run), not the job (a job-level kill
    # skips always()).
    #
    # FULL HEADLESS SUITE (headless determinism) — no `--skip`: running the whole
    # suite here, once, in this shared composite keeps all four jobs (both languages,
    # both repos) on the same section set. §10
    # game.start, §14 editor_get_console, and flows §02 are now is_headless-aware: the
    # toolkit returns deterministic, self-explaining responses headless (game.start
    # HEADLESS_UNSUPPORTED; the editor.get_console `headless_hint` steering to
    # script_check; the 4.4+ headless stale-instance hint) and the server asserts them.
    # §04/§13/§18 screenshots assert the HEADLESS_UNSUPPORTED guard. So the FULL smoke +
    # flows suites run headless with NO --skip.
    - name: Smoke (full suite, headless-deterministic)
      if: ${{ steps.boot.outputs.known_crash != 'true' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      env:
        GODOT_MCP_PROJECT_PATH: ${{ inputs.project-path }}
        GODOT_MCP_PROJECT_NAME: ${{ inputs.project-name }}
        # 4.3+ launched with --log-file (above), so source="file" MUST read real entries — this
        # catches a silently-misaligned --log-file. 4.2 has no --log-file -> LOG_UNAVAILABLE, its
        # own valid deterministic branch. The signal keys which §14 outcome the test requires.
        SMOKE_EXPECT_FILE_LOG: ${{ startsWith(inputs.godot-version, '4.2') && '0' || '1' }}
      run: $TIMEOUT_BIN -k 30 900 npm run smoke

    - name: Flows (full suite, headless-deterministic)
      if: ${{ steps.boot.outputs.known_crash != 'true' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      env:
        GODOT_MCP_PROJECT_PATH: ${{ inputs.project-path }}
        GODOT_MCP_PROJECT_NAME: ${{ inputs.project-name }}
      run: $TIMEOUT_BIN -k 30 600 npm run flows

    # Dispatch-integration leg — runs ONLY on the rows the
    # caller flags with run-dispatch: true (GDScript · 4.7.0, one per repo mirror, on
    # EACH of the three platforms). The 7 flows exercise FIFO ordering, cancellation,
    # peer-disconnect, and scene-lease semantics against the already-booted editor — the
    # last editor-required CI coverage gap, and a per-OS-sensitive surface (sockets +
    # timing). The runner bypasses the MCP bridge BY DESIGN, so it needs the raw WS
    # token: extract it from the editor's user:// dir by glob (the project name varies
    # per fixture/dogfood; exactly one match on a fresh runner, guaranteed present
    # because smoke+flows already authenticated). The user-data root is OS-specific —
    # it mirrors Godot's OS::get_data_path (Linux ~/.local/share/godot [lowercase, XDG];
    # macOS ~/Library/Application Support/Godot; Windows %APPDATA%/Godot). On Windows
    # $APPDATA carries backslashes, which break glob expansion, so cygpath -u first. The
    # port defaults to 6550 (GODOT_MCP_EDITOR_PORT — the port the composite already
    # polls), so nothing to set. Composite `run` steps can't take timeout-minutes, so a
    # $TIMEOUT_BIN fuse (proportionate to smoke 900 / flows 600) fails the STEP on a
    # hang, preserving the always() log steps below.
    - name: Dispatch integration (flagged rows only)
      if: ${{ inputs.run-dispatch == 'true' && steps.boot.outputs.known_crash != 'true' }}
      working-directory: ${{ inputs.server-dir }}
      shell: bash
      run: |
        set -o pipefail
        case "${{ inputs.os }}" in
          windows) udroot="$(cygpath -u "$APPDATA")/Godot/app_userdata" ;;
          macos)   udroot="$HOME/Library/Application Support/Godot/app_userdata" ;;
          *)       udroot="$HOME/.local/share/godot/app_userdata" ;;
        esac
        token_file=$(ls "$udroot"/*/addons/godot_mcp_toolkit/project_instance_*/mcp_token 2>/dev/null | head -n1)
        if [ -z "$token_file" ]; then
          echo "::error::dispatch: no mcp_token found under the editor user:// dir ($udroot)."
          exit 1
        fi
        echo "dispatch: using token file $token_file"
        GODOT_MCP_TOKEN="$(cat "$token_file")" "$TIMEOUT_BIN" -k 30 300 npm run test:integration:dispatch

    # Teardown: stop the editor so editor.log is complete before the check below reads
    # it. Godot 4.2 on Windows block-buffers stderr redirected to a file, and a killed
    # editor loses the unflushed tail, so a cut-off script error could pass unread. The
    # stop therefore, on every row:
    #   1. has the editor printerr a unique sentinel twice through execute.code
    #      (scripts/ci/editor-clean-stop.mjs) and waits 5 s;
    #   2. asks it to quit through execute.code (`get_tree().quit()`), a normal exit
    #      that flushes stderr; a response, a dropped connection or a call timeout
    #      counts as accepted;
    #   3. waits up to 30 s of wall time for the editor process to exit;
    #   4. only if it is still alive, kills it: `kill` on Linux/macOS; on Windows the
    #      WS port's LISTENING owner PID, since $! is an MSYS shim pid and the runner's
    #      exe is Godot_v<ver>_win64.exe, never godot.exe (GitHub Actions only). The port's
    #      owner is the editor itself, never the launcher above it, so this reaches the
    #      editor whichever of the two dies first, and the launcher exits with the editor;
    #   5. annotates the quit outcome, the seconds to exit and whether the kill fired.
    # An editor that closed its port without exiting has no port owner to find. On Windows
    # the launch step's native PID still leads to it, through a tree kill that has to come
    # before the POSIX kill, which would end only the launcher.
    # The sentinel outcome goes to $GITHUB_ENV for the check below: the sentinel itself
    # (the check fails a log that lacks it), why it went unsent (editor gone or
    # unreachable: the check warns), or why it failed (the editor refused it, or the stop
    # script broke: the check fails). The step itself never fails the job.
    - name: Stop editor with a clean quit (always)
      if: always()
      shell: bash
      env:
        GODOT_MCP_PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        set +e
        stop_script="${{ inputs.server-dir }}/scripts/ci/editor-clean-stop.mjs"
        # Outside the workspace root, which is the editor's project in some callers.
        out_dir="${RUNNER_TEMP:-/tmp}"
        # Milliseconds from node: macOS `date` has no %N.
        now_ms() { node -e 'process.stdout.write(String(Date.now()))'; }
        if [ "${{ inputs.os }}" = "windows" ]; then
          port="${GODOT_MCP_EDITOR_PORT:-6550}"
          editor_pid="$(netstat -ano 2>/dev/null | grep -E ":$port[^0-9]" | grep LISTENING | awk '{print $NF}' | sort -u | head -n1)"
          [ "$editor_pid" = "0" ] && editor_pid=""
          gone_reason="nothing was LISTENING on the editor port $port at teardown"
          alive() { [ -n "$editor_pid" ] && tasklist //FI "PID eq $editor_pid" 2>/dev/null | grep -q " $editor_pid "; }
        else
          editor_pid="${EDITOR_PID:-}"
          gone_reason="the editor process (PID ${editor_pid:-not recorded}) had already exited at teardown"
          alive() { [ -n "$editor_pid" ] && kill -0 "$editor_pid" 2>/dev/null; }
        fi
        echo "editor PID to stop: ${editor_pid:-none found}"

        if ! alive; then
          echo "MCP_STOP_SENTINEL_UNSENT=$gone_reason" >> "$GITHUB_ENV"
          # The `kill -0` keeps a PID Windows may have reused since the launcher exited out of taskkill.
          if [ "${{ inputs.os }}" = "windows" ] && [ -n "${EDITOR_WINPID:-}" ] && kill -0 "$EDITOR_PID" 2>/dev/null; then
            taskkill //F //T //PID "$EDITOR_WINPID" 2>&1 || true
          fi
          kill "$EDITOR_PID" 2>/dev/null || true
          echo "::notice title=Editor stop::$gone_reason; no sentinel sent, no quit requested"
          exit 0
        fi

        sentinel="MCP_STOP_SENTINEL_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_${{ inputs.language }}"
        node "$stop_script" --sentinel "$sentinel" > "$out_dir/sentinel.out" 2>&1
        cat "$out_dir/sentinel.out"
        verdict="$(grep -E '^sentinel=(sent|unsent|failed)' "$out_dir/sentinel.out" | head -n1)"
        case "$verdict" in
          sentinel=sent*)
            echo "MCP_STOP_SENTINEL=$sentinel" >> "$GITHUB_ENV"
            sleep 5
            ;;
          sentinel=unsent*)
            echo "MCP_STOP_SENTINEL_UNSENT=the editor was unreachable ${verdict#sentinel=unsent }" >> "$GITHUB_ENV"
            ;;
          *)
            echo "MCP_STOP_SENTINEL_FAILED=${verdict:-editor-clean-stop.mjs printed no verdict line}" >> "$GITHUB_ENV"
            ;;
        esac

        quit_start="$(now_ms)"
        node "$stop_script" --quit > "$out_dir/quit.out" 2>&1
        cat "$out_dir/quit.out"
        quit_note="$(grep -o '^quit_request=.*' "$out_dir/quit.out" | head -n1)"
        exit_note="still running 30 s after the quit request returned"
        if [ "${quit_note#quit_request=accepted}" != "$quit_note" ]; then
          # A wall-clock deadline: each alive check costs time of its own (tasklist on Windows).
          deadline=$(( $(now_ms) + 30000 ))
          while alive && [ "$(now_ms)" -lt "$deadline" ]; do sleep 0.5; done
          if ! alive; then
            exit_note="exited $(awk -v a="$(now_ms)" -v b="$quit_start" 'BEGIN{printf "%.1f", (a-b)/1000}') s after the quit request"
          fi
        else
          exit_note="not waited for (quit not accepted)"
        fi

        fallback="no"
        if alive; then
          fallback="yes"
          kill "$EDITOR_PID" 2>/dev/null || true
          if [ "${{ inputs.os }}" = "windows" ] && [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            taskkill //F //T //PID "$editor_pid" 2>&1 || true
          fi
        fi
        level="notice"
        [ "$fallback" = "yes" ] && level="warning"
        echo "::$level title=Editor stop::${quit_note:-quit_request=no verdict line}; editor $exit_note; forced kill fired: $fallback"
        exit 0

    # After the stop, so editor.log is complete and a crash at exit is in scope. A Linux core
    # or a Windows dump is on disk once the process is gone; macOS's reporter writes later, so
    # the script holds every macOS leg, a green one too. On Windows it also runs cdb over each
    # dump on the runner, and the text alone goes into the upload.
    # Composite steps cannot take `timeout-minutes`, so the collect step carries a shell fuse
    # over its own bounded waits, which several slow dumps or cores could add up past.
    # github.action_status, not job.status: it is the one that sees a failure inside this
    # composite. A fuse kill leaves the upload output unset, and the upload then still takes
    # the logs and the stack texts the script wrote first.
    - name: Collect crash reports (always)
      id: crash-reports
      if: always()
      continue-on-error: true
      shell: bash
      env:
        LEG_STATUS: ${{ github.action_status }}
      run: |
        case "${{ inputs.os }}" in
          windows) reports="$RUNNER_TEMP/crash-dumps" ;;
          macos)   reports="$HOME/Library/Logs/DiagnosticReports" ;;
          *)       reports=/tmp/cores ;;
        esac
        "${TIMEOUT_BIN:-timeout}" -k 10 420 node "${{ inputs.server-dir }}/scripts/ci/collect-crash-reports.mjs" \
          --os "${{ inputs.os }}" \
          --out "$RUNNER_TEMP/crash-report" \
          --reports "$reports" \
          --editor-bin "$(command -v godot || true)" \
          --leg-status "$LEG_STATUS" \
          --editor-gone "${MCP_STOP_SENTINEL_UNSENT:-}" \
          --log editor.log \
          --log warmup.log

    # A leg with no report uploads nothing, or only its logs: the absence of a report never
    # fails a job. The name carries the leg and the attempt, since artifact names are unique
    # within a run and a re-run's report is the evidence a new runner gives.
    - name: Upload crash reports (always)
      if: ${{ always() && steps.crash-reports.outputs.upload != 'false' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: crash-report-${{ inputs.os }}-${{ inputs.godot-version }}-${{ inputs.language }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/crash-report
        retention-days: 14
        if-no-files-found: warn

    # Nothing else checks the editor log for errors, so without this step a GDScript error
    # raised in the toolkit addon (a renamed engine API on a new Godot version) leaves the
    # job green. It fails the job on a SCRIPT ERROR whose erroring frame is a toolkit file,
    # and on a missing or empty editor.log; the rule and its known gaps are in the
    # script's header. It also fails when the stop sentinel is missing, since that log
    # lost its tail, and when the editor refused the sentinel or the stop script broke;
    # when the editor was gone or unreachable, it warns instead and the other outcomes
    # stand. editor.log sits in the workspace root, where the launch step
    # writes it. warmup.log (4.2 only) is not checked: its tee holds the tail of a failed
    # boot attempt, which carries the transient `Identifier "…" not declared` parse errors
    # expected on 4.2, so a recovered retry would fail the job. A warm-up that never
    # succeeds already fails its own step.
    - name: Fail on toolkit script errors in the editor log (always)
      if: always()
      shell: bash
      run: |
        if [ -n "${MCP_STOP_SENTINEL:-}" ]; then
          set -- --require-sentinel "$MCP_STOP_SENTINEL"
        elif [ -n "${MCP_STOP_SENTINEL_FAILED:-}" ]; then
          set -- --sentinel-failed "$MCP_STOP_SENTINEL_FAILED"
        else
          set -- --sentinel-not-sent "${MCP_STOP_SENTINEL_UNSENT:-the stop step did not run}"
        fi
        node "${{ inputs.server-dir }}/scripts/ci/editor-log-script-errors.mjs" editor.log "$@"

    - name: Editor + warm-up logs (always)
      if: always()
      shell: bash
      run: |
        cat warmup.log 2>/dev/null || true
        cat editor.log || true

    # Fail-safe forensics again at teardown — the END-state twin of the
    # post-launch snapshot above (did a zombie persist through the suite?).
    - name: Platform diagnostics at teardown (always, windows)
      if: ${{ always() && inputs.os == 'windows' }}
      shell: bash
      run: |
        echo "── EDITOR_PID=${EDITOR_PID:-unset} ──"
        tasklist 2>/dev/null | grep -iE "godot" || true
        echo "── port owners (6550/6551/6005) ──"
        netstat -ano 2>/dev/null | grep -E ":(6550|6551|6005)[^0-9]" || true
        echo "── toolkit registry ──"
        cat "$(cygpath -u "$APPDATA")/godot-mcp-toolkit/projects.json" 2>/dev/null || true
        echo "forensics key: H1 (zombie warm-up editor) = 2+ godot PIDs, or 6005/6550 owned by a PID that is not the main editor, or the registry shows the main editor on 6551 -> fix: warm-up teardown (toolkit scripts/test_framework/run_units_cold.sh). H2 (engine-internal LSP wedge) = exactly 1 godot PID, 6005 owned by the main editor, initialize still mute -> upstream Godot 4.2 defect (no LSP bind retry 4.2-4.4; unbudgeted main-thread poll, fixed-shape 4.3); the mitigation options are a maintainer decision."
        exit 0
