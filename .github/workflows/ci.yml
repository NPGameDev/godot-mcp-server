name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format

      # CI smoke tests validate the static tool catalogue WITHOUT a running
      # Godot editor. Checks: tool count, gate membership, description length,
      # echo round-trip, schema integrity, tool coverage, annotation
      # completeness, naming conventions.
      #
      # Full interactive smoke tests (43 sections) require a Godot 4.x editor
      # on port 6550 with the toolkit plugin enabled. Run locally:
      #   npm run smoke
      # See test/README.md or CONTRIBUTING.md for setup instructions.
      - name: Smoke test (CI mode — catalogue + structural validation)
        run: npm run smoke:ci
