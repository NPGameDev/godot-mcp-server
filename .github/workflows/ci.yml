name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub fires merge_group against the temporary
  # refs/heads/gh-readonly-queue/... branch once a PR is enqueued, and blocks the merge
  # on the required checks that report there — so the floor MUST run on this event, or a
  # required check bound to "Server floor OK" stays pending forever and stalls the queue.
  # Nothing else needs changing: no floor job below is gated on an event name or a
  # commit-message token, so all of them run here exactly as they do on a PR, and the
  # aggregate therefore cannot pass vacuously. The gh-readonly-queue ref does not match
  # the push filter above, so a queued PR produces ONE floor run, not two.
  merge_group:

# D7 (going-public supply-chain baseline): least privilege by default. No floor job
# writes repo contents; the release path grants its own contents: write per-job.
permissions:
  contents: read

# D6: cancel an in-flight floor run when a newer commit lands on the same ref — the
# floor gates the tip, so a superseded run's result is moot. NOT on cross-version.yml:
# those deep-tier runs are deliberate and must never be auto-cancelled. Keying the group
# on github.ref is what keeps this safe for the merge queue: every queue entry gets its
# own gh-readonly-queue ref, so a merge-queue run lands in a group of its own and a PR
# (or main) run can never cancel the required check out from under the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # D3: Node 20 reached EOL 2026-04-30 — dropped. 22 (Active LTS) + 24 (Current);
        # engines.node is ">=22" (pre-1.0 clean break, no compat shim). The release job
        # runs on 24 (npm >= 11.5.1 — the 42b OIDC trusted-publishing prerequisite).
        node-version: [22.x, 24.x]
    name: "Server floor (Node ${{ matrix.node-version }}): build+unit+lint+format+smoke:ci"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format

      # CI smoke tests validate the static tool catalogue WITHOUT a running
      # Godot editor. Checks: tool count, description length,
      # echo round-trip, schema integrity, tool coverage, annotation
      # completeness, naming conventions.
      #
      # Full interactive smoke tests (43 sections) require a Godot 4.x editor
      # on port 6550 with the toolkit plugin enabled. Run locally:
      #   npm run smoke
      # See test/README.md or CONTRIBUTING.md for setup instructions.
      - name: Smoke test (CI mode — catalogue + structural validation)
        run: npm run smoke:ci

  # ── C# (.NET) build floor — editor-free, TFM-boundary Godot.NET.Sdk rows ──────
  # dotnet build needs no Godot editor: Godot.NET.Sdk + GodotSharp restore from
  # nuget.org. Proves the toolkit's C# surface compiles across the SDK/TFM range.
  # Behavioral C# (§25) rides the opt-in cross-version.yml, not here.
  #
  # D4: trimmed 6 rows -> the 3 TFM boundaries. The fixture rarely changes and a
  # middle SDK row cannot fail a *compile* differently from its boundary neighbors;
  # the deep tier `dotnet build`s the fixture on all six versions per opt-in run, so
  # SDK breadth lives there. Boundaries kept:
  #   • 4.2.0 / net6.0 — the net6 floor (minimum supported SDK)
  #   • 4.4.0 / net8.0 — the net6->net8 TFM flip (source-verified via Godot's
  #     ProjectGenerator.GodotMinimumRequiredTfm; see build-packet §7b)
  #   • 4.7.0 / net8.0 — the net8 ceiling
  csharp-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot-sdk: "4.2.0"
            tfm: "net6.0"
          - godot-sdk: "4.4.0"
            tfm: "net8.0"
          - godot-sdk: "4.7.0"
            tfm: "net8.0"
    # Display name: intent first, the VARYING (SDK / TFM) detail inside the first
    # ~45 chars so the Actions UI never truncates it away — the former
    # "— editor-free SDK floor" tail pushed the version past the fold; that
    # context lives in this comment block instead (user directive 2026-07-04).
    name: "C# fixture compiles (Godot.NET.Sdk ${{ matrix.godot-sdk }} / ${{ matrix.tfm }})"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDKs (6 + 8)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      # Retarget BOTH the SDK version and the TargetFramework to the matrix row.
      # The Sdk="…/X" attribute cannot be -p-overridden, and setting
      # TargetFramework as a -p: global property breaks NuGet restore: the
      # implicit restore reads the csproj's own <TargetFramework>, so an
      # overridden build then can't find that framework's assets (the net6.0
      # rows failed exactly this way). Rewriting both in the csproj keeps restore
      # and build consistent. The committed csproj pins the 4.7.0 / net8.0
      # ceiling so it builds locally as-is. Ephemeral — never committed.
      - name: Pin Godot.NET.Sdk + TargetFramework to matrix row
        run: |
          node -e 'const fs=require("node:fs");const f="test/fixtures/csharp-project/McpValCs.csproj";let s=fs.readFileSync(f,"utf8");s=s.replace(/Godot\.NET\.Sdk\/[0-9.]+/,"Godot.NET.Sdk/"+process.env.SDK);s=s.replace(/<TargetFramework>[^<]*<\/TargetFramework>/,"<TargetFramework>"+process.env.TFM+"</TargetFramework>");fs.writeFileSync(f,s);console.log(s);'
        env:
          SDK: ${{ matrix.godot-sdk }}
          TFM: ${{ matrix.tfm }}

      - name: dotnet build (editor-free)
        run: dotnet build test/fixtures/csharp-project/McpValCs.csproj -c Debug

  # Editor-free distribution smoke: prove the PUBLISHED package installs globally
  # and its bin runs on Linux. The smoke harness spawns `tsx test/smoke.ts` (never
  # the bin), and release.yml publishes without install-and-run — so nothing else
  # exercises `npm install -g` → `godot-mcp-server`. `--tools-count` is static (no
  # editor / no MCP connection), so this belongs in the per-push floor.
  pack-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the package
        run: npm pack
      - name: Install the packed tarball globally
        run: npm install -g ./npgamedev-godot-mcp-server-*.tgz
      - name: Run the installed bin (asserts PATH + shebang + expected output)
        run: |
          out=$(godot-mcp-server --tools-count)
          echo "$out"
          echo "$out" | grep -q "Total tools:"

  # Supply-chain audit — a blocking per-PR gate. Pinned npm + production-only,
  # high/critical only, so a real production advisory reddens the PR but dev-only /
  # moderate noise never blocks unrelated work. Pinned exactly because the 11->12 npm
  # boundary changes install semantics. The assertion double-checks the exit code
  # because npm has shipped --audit-level exit-code regressions.
  npm-audit:
    runs-on: ubuntu-latest
    name: "Supply-chain audit (production advisories)"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Audit (fail on high/critical production advisories)
        run: |
          npm install -g npm@11.11.0
          set +e
          npm audit --omit=dev --audit-level=high
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::npm audit found high/critical production advisories."
            exit 1
          fi

  # ── Aggregate floor gate (D8) ────────────────────────────────────────────────
  # "Server floor OK" is the SINGLE name bound as a required check — on the protected
  # branch and in the merge queue alike — never an individual matrix row. A required
  # check pinned to a matrix leg breaks whenever the matrix is retuned (D3/D4 just did);
  # pinning to this one stable name never does. Every job in needs: runs unconditionally
  # on every trigger this workflow accepts, merge_group included, so the gate is always
  # substantive: an all-skip, which WOULD pass vacuously here, is structurally
  # impossible. `if: always()` + the explicit failure/cancelled test also
  # makes future path-filtered docs-skips safe: an `if:`-skipped upstream reports
  # success here, whereas a `paths:`-skipped required check would deadlock as pending.
  floor-ok:
    name: "Server floor OK"
    needs: [build-lint-smoke, csharp-build, pack-install, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every floor job succeeded
        run: |
          result="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$result" = "true" ]; then
            echo "::error::A server floor job failed or was cancelled."
            exit 1
          fi
          echo "All server floor jobs succeeded."
