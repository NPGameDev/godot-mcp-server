name: Release

# Release path — gated on the deep behavioral tier (D13) and dry-runnable.
#
# Two entry points:
#   • v* tag push       → real release: the behavioral matrix runs first (via
#                         workflow_call), then publish + GH Release.
#   • workflow_dispatch → DRY-RUN by default: runs EVERYTHING (the called behavioral
#                         matrix + the package-shape gate) but skips npm publish +
#                         GH-Release creation. Makes the whole release path testable
#                         off a tag NOW instead of first-firing at 42b. Dispatching ON
#                         a tag ref with dry-run: false is the manual re-run escape
#                         hatch after a transient tag-push failure.
#
# ⚠ Called-workflow gate caveat (D13): the behavioral callee evaluates github.ref /
# event_name from THIS (caller) context — a v* tag push satisfies its
# startsWith(github.ref,'refs/tags/v') gates; a dry-run dispatch satisfies its
# event_name=='workflow_dispatch' gates. If release.yml ever gains a NEW trigger type
# (e.g. schedule), the callee's opt-in jobs would all-skip and the behavioral: call
# would succeed VACUOUSLY, un-gating publish — re-verify the callee gates whenever the
# release triggers change.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the full gated release path but skip npm publish + GH Release. Default true — a manual dispatch can never accidentally publish; real releases fire via tag push (inputs empty)."
        type: boolean
        required: false
        default: true

# A re-dispatch must never race a still-running tag run, and a release job must
# never be killed mid-publish — so cancel-in-progress is false.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# D7: least privilege at the top; the publish job re-grants contents: write for the GH
# Release upload and id-token: write for npm OIDC trusted publishing.
permissions:
  contents: read

jobs:
  # D13: gate the release on the full cross-version behavioral matrix. The callee's
  # own workflow-level SIBLING_PIN_* env resolves normally under workflow_call, and
  # inputs.sibling-ref is empty when called -> the pin holds.
  behavioral:
    uses: ./.github/workflows/cross-version.yml

  publish:
    needs: behavioral
    runs-on: ubuntu-latest
    # D7: re-grant write for the GH Release. id-token: write is what npm OIDC trusted
    # publishing mints its short-lived credential from (needs npm >= 11.5.1 -> the Node 24
    # setup below); granted here so enabling the trusted publisher is a npmjs.com settings
    # change, not a workflow edit.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 (D3/D14): npm >= 11.5.1 is the 42b OIDC trusted-publishing
          # prerequisite — harmless today, dry-run-testable now, removes a 42b landmine.
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real releases fire on a tag push (github.ref_type == 'tag'); a dispatch from a
      # branch has ref_type 'branch', so this check would spuriously fail — skip it off
      # a tag. Publish + Release below carry the same tag guard plus the dry-run guard.
      - name: Validate tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          VER="${TAG#v}"
          # The CHANGELOG must carry a section for the tagged version — a tag with
          # no rolled section means the release script's roll step was skipped.
          if ! grep -qF "## [$VER]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section for the tagged release."
            exit 1
          fi
          echo "Version validated: $TAG"

      # Read the pinned toolkit SHA from cross-version.yml (single-sourced there,
      # not duplicated here) so the checkout below pins the same revision the
      # behavioral gate tested against.
      - name: Read the pinned toolkit SHA
        id: pin
        if: github.ref_type == 'tag'
        run: |
          PIN="$(grep 'SIBLING_PIN_TOOLKIT:' .github/workflows/cross-version.yml | sed -E 's/.*"([0-9a-f]+)".*/\1/')"
          if [ -z "$PIN" ]; then
            echo "::error::Could not read SIBLING_PIN_TOOLKIT from cross-version.yml."
            exit 1
          fi
          echo "sha=$PIN" >> "$GITHUB_OUTPUT"

      # Check out the pinned toolkit sibling to read its declared version. Mirrors
      # the sibling-checkout idiom cross-version.yml uses. Only on a real tag push.
      - name: Check out the pinned toolkit sibling
        if: github.ref_type == 'tag'
        uses: actions/checkout@v7
        with:
          repository: NPGameDev/godot-mcp-toolkit
          path: toolkit-pin
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ github.token }}

      # The pinned toolkit sibling's DECLARED version must equal the tag — makes
      # the bump-before-tag pin ritual machine-checked (a stale pin = green tests
      # of the WRONG pairing, the pipeline's most likely silent failure).
      - name: Pinned sibling declared version matches the tag
        if: github.ref_type == 'tag'
        run: |
          PIN="${{ steps.pin.outputs.sha }}"
          VER="${GITHUB_REF#refs/tags/v}"
          TK_CFG="$(grep '^version=' toolkit-pin/addons/godot_mcp_toolkit/plugin.cfg | cut -d'"' -f2)"
          if [ -z "$TK_CFG" ]; then
            echo "::error::Could not read the pinned toolkit plugin.cfg version at $PIN."
            exit 1
          fi
          if [ "$TK_CFG" != "$VER" ]; then
            echo "::error::Pinned toolkit ($PIN) declares version $TK_CFG, tag is $VER — bump SIBLING_PIN_TOOLKIT before tagging."
            exit 1
          fi
          echo "Pinned toolkit declared version matches: $VER"

      - name: Build
        run: npm run build

      # D15 — package-shape gate BEFORE publish (runs on dry-runs too; that's the point):
      #   • npm pack   — materializes the exact tarball that would ship (files[] correct).
      #   • publint    — lints package.json for publish-time footguns (bin/exports/types).
      #   • docs:api freshness — regenerate the typedoc tool-reference and fail if the
      #     committed docs/ drift. @arethetypeswrong/cli is intentionally skipped (this is
      #     a CLI package, not a types consumer).
      - name: Pack (materialize the publish tarball)
        run: npm pack

      - name: Lint package shape (publint)
        run: npm run lint:pkg

      # The diff scopes all of docs/, but regenerating only docs:api would leave
      # docs/tool-reference/ diffed against a subtree it never regenerated (a
      # tautology — a stale tool reference passes green). Regenerate both so the
      # gate enforces the scope it claims.
      - name: Generated docs are fresh (API + tool reference)
        run: |
          npm run docs:api
          npm run docs:tools
          git diff --exit-code -- docs/

      # Advisories drift over time with NO code change, so a release cut weeks after
      # the last PR could ship a newly-published high/critical production advisory the
      # per-PR gate never saw. Same pinned, production-only audit as the PR gate. Runs
      # on dry-runs too (that is the rehearsal value). Pinned npm: the 11->12 boundary
      # changes install semantics, so the audit npm is pinned exactly.
      - name: Pre-publish supply-chain audit (production advisories)
        run: |
          npm install -g npm@11.11.0
          npm audit --omit=dev --audit-level=high

      # Publish + Release only on a real tag push, and NEVER on a dry-run. Dispatching ON
      # a tag ref with dry-run: false is the deliberate manual re-run path. inputs['dry-run']
      # (bracket form — the property name has a hyphen) is null on a tag push -> != true.
      # Skip (with a loud notice) if the version already resolves on npm, so the
      # documented re-dispatch recovery path stays green after a run that published
      # but then failed at the GH-Release step (softprops updates an existing release).
      - name: Publish to npm
        if: ${{ github.ref_type == 'tag' && inputs['dry-run'] != true }}
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already published — skipping npm publish (idempotent re-run)."
          else
            npm publish
          fi
        # No NODE_AUTH_TOKEN: the registry authenticates this job through OIDC trusted
        # publishing, minted from the id-token: write grant above. The package disallows
        # token publishes entirely, so a long-lived secret would not work even if one
        # existed — the trusted publisher is bound to this repository and this workflow
        # file, which is why renaming or moving the file breaks publishing.

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && inputs['dry-run'] != true }}
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # Prove the PUBLISHED tarball runs — fetched from the registry, in a clean job with no
  # checkout and no build, which is the only thing that catches a packaging fault the
  # source-built gates cannot see (missing bin, absent dist/, bad shebang, files[] hole).
  #
  # Deliberately a SEPARATE job downstream of publish rather than more steps inside it: the
  # gated matrix and the publish itself must never depend on npm read availability. If the
  # registry is slow or down, this job is what goes red — after the release already landed.
  live-package:
    needs: publish
    # Same gate as the publish step it verifies: real tag pushes only, never a dry-run
    # (a dry-run publishes nothing, so there would be nothing to fetch).
    if: ${{ github.ref_type == 'tag' && inputs['dry-run'] != true }}
    runs-on: ubuntu-latest
    # D7: no write scope anywhere — this job only reads the registry. contents: read (the
    # workflow default) rather than {} because setup-node authenticates its version-manifest
    # fetch with github.token when the requested Node is not already in the runner cache.
    permissions:
      contents: read
    steps:
      # No `cache: npm` — there is no checkout, so there is no lockfile to key a cache on.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Smoke the published package
        run: |
          PKG="@npgamedev/godot-mcp-server"
          # Derived from the tag, never hardcoded — the publish job has already proven the
          # tag equals package.json's version, so this is the version that just shipped.
          VER="${GITHUB_REF#refs/tags/v}"
          echo "Verifying $PKG@$VER"

          # A publish is visible to the registry's read path seconds to minutes after it
          # succeeds, so resolve with a bounded retry before calling it a failure.
          for attempt in 1 2 3 4 5; do
            if npm view "$PKG@$VER" version; then
              echo "Resolved $PKG@$VER on the registry (attempt $attempt)."
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::$PKG@$VER never resolved on the registry after $attempt attempts."
              exit 1
            fi
            echo "Not published to the read path yet — retrying in 30s (attempt $attempt)."
            sleep 30
          done

          # Exercise the installed bin through the meta flags, which exit 0 without needing
          # an editor, a project, or a stdio MCP peer.
          npx --yes "$PKG@$VER" --tools-count
          npx --yes "$PKG@$VER" --help
