# Behavioral cross-version tier (C# / .NET) — opt-in, editor-required.
#
# Companion to the editor-free csharp-build floor in ci.yml (which compiles the
# fixture against every Godot.NET.Sdk). This tier launches a real headless MONO
# editor against the committed C# fixture and round-trips the FULL server smoke +
# flows suites (minus the headless-incompatible §10/§14 + flows §02, pending
# 41n-quater-bis) through the WS bridge, one job per supported minor — the .NET
# mirror of the GDScript tier, driven by the SHARED language-parameterized
# composite (.github/actions/cross-version-behavioral, language: dotnet). Both
# tiers run the byte-identical section set, so they cannot drift (iter
# 41n-quater-ter). NOT a merge gate — opt-in only:
#   • [run-cross-version-ci] in the push commit message
#   • a v* release tag (backstop: never SHIP a C# cross-version regression)
#   • workflow_dispatch
# No schedule: (see the toolkit cross-version.yml rationale). 4.2 is excluded here
# — pending the dedicated 4.2-mono leg (41n-quater-septies), which adds the 4.2 row
# on top of this shared composite (the class-cache warm-up already ports from the
# GDScript 4.2 tier). Until then, 4.2 §25 runs via the local release gate.
#
# Feasibility proven 2026-07-01 (41n-quater Stage-2): a display-less runner serves
# the mono WS round-trip (§25 15/0, real Speed 200->201 + Poked signal on Godot 4.5).
#
# The addon lives in the TOOLKIT repo, so it's checked out as a sibling and injected
# into the fixture at run time (never committed). Private-repo checkout uses the
# read-only PAT (CROSS_REPO_READ_TOKEN); the || github.token fallback goes tokenless
# once the repos are public.
name: cross-version (C# behavioral)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  csharp-behavioral:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[run-cross-version-ci]')
    runs-on: ubuntu-latest
    # Fuse: observed legs finish in ~7 min (full smoke+flows on mono) — a leg still
    # running at 30 min is hung (e.g. an editor boot that never serves the port).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # SDK version == editor version (mono editor + Godot.NET.Sdk must match).
      # TFM tracks the net6->net8 boundary at 4.4 (source-verified) so the editor's
      # on-open build produces an assembly its bundled runtime can load: a 4.3 editor
      # ships the .NET 6 runtime and cannot load a net8.0 assembly.
      matrix:
        include:
          - godot-version: "4.3.0"
            tfm: "net6.0"
          - godot-version: "4.4.0"
            tfm: "net8.0"
          - godot-version: "4.5.0"
            tfm: "net8.0"
          - godot-version: "4.6.2"
            tfm: "net8.0"
          - godot-version: "4.7.0"
            tfm: "net8.0"
    name: "Behavioral (.NET editor · Godot ${{ matrix.godot-version }} / ${{ matrix.tfm }}): smoke+flows"
    steps:
      - uses: actions/checkout@v4 # server (self) = harness + C# fixture + composite

      - uses: actions/checkout@v4 # toolkit = addon source (injected into fixture)
        with:
          repository: NPGameDev/godot-mcp-toolkit
          path: toolkit
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: "Behavioral (.NET editor · Godot ${{ matrix.godot-version }}): smoke+flows"
        uses: ./.github/actions/cross-version-behavioral
        with:
          language: dotnet
          godot-version: ${{ matrix.godot-version }}
          tfm: ${{ matrix.tfm }}
          project-path: ${{ github.workspace }}/test/fixtures/csharp-project
          project-name: "MCP CSharp Fixture"
          toolkit-addon-src: ${{ github.workspace }}/toolkit/addons/godot_mcp_toolkit
          # server-dir defaults to "." (server is the self checkout)
